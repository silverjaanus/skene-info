<style>
:root{
{{S003}}
  --sans:"Helvetica Neue",Helvetica,Arial,ui-sans-serif,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
  --hdrmuted:#A6A192; /* tume päis: summutatud tekst */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paber);color:var(--tint);font-family:var(--sans);font-size:16px;line-height:1.45}
a{color:inherit}
/* tume plakatipea (E+F ümberdisain 08.2026): kogu päis tint-taustal, žanrisõnad pealkirjana */
header{background:var(--tint);color:var(--paber);padding:26px 0 0}
.masthead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;border-bottom:3px solid var(--paber);padding:0 24px 14px;max-width:1280px;margin:0 auto}
.brand-wrap{display:flex;flex-direction:column;min-width:0}
{{S004}}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.gwords{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
.gword{font-family:var(--sans);font-size:clamp(28px,4.4vw,46px);font-weight:700;text-transform:uppercase;letter-spacing:2px;line-height:.92;color:var(--wc)}
.gword a{color:inherit;text-decoration:none}
.gword.w-metal{--wc:#D96A52}
.gword.w-rap{--wc:#6E9BE0}
.gword.w-klubi{--wc:#A87FE8}
@supports(-webkit-text-stroke:1px #000){
  .gword{-webkit-text-stroke:1.05px var(--wc);-webkit-text-fill-color:transparent}
  .gword.on,.gword:hover,.gword:focus-within{-webkit-text-fill-color:var(--wc)}
}
.umbrella{font-family:var(--mono);font-size:12px;color:var(--hdrmuted);letter-spacing:1px;margin-top:6px}
.umbrella b{color:var(--paber)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
h1{font-size:clamp(38px,6vw,60px);line-height:.92;letter-spacing:-2px;text-transform:uppercase;font-weight:700}
h1 a{text-decoration:none}
.arch-badge{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--tint);background:var(--paber);padding:3px 9px;text-transform:uppercase}
.tagline{font-family:var(--mono);font-size:13px;color:var(--hdrmuted);max-width:340px;text-align:right}
.mast-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:340px}
.author{font-family:var(--mono);font-size:11px;color:var(--hdrmuted);text-align:right}
.author a{color:var(--bri);text-decoration:none;border-bottom:1px solid transparent}
.author a:hover{border-bottom-color:var(--bri)}
.topnav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 18px;padding:10px 24px 12px;font-family:var(--mono);font-size:12.5px;max-width:1280px;margin:0 auto}
.topnav .nav-links{display:flex;flex-wrap:wrap;gap:8px 16px}
.topnav .nav-links a{text-decoration:none;color:var(--paber)}
.topnav .nav-links a:hover{color:var(--bri)}
.langsw{display:flex;border:1.5px solid var(--joon);flex:none}
.langsw button{font-family:var(--mono);font-size:11.5px;background:transparent;color:var(--hdrmuted);border:0;padding:3px 9px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.langsw button.on{background:var(--paber);color:var(--tint)}
#toTop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border:2px solid var(--tint);background:var(--paber);color:var(--tint);font-size:21px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:50;box-shadow:2px 2px 0 var(--tint)}
#toTop:hover{background:var(--tint);color:var(--paber)}
#toTop.show{display:flex}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px 40px;display:grid;grid-template-columns:190px 1fr;gap:28px;align-items:start}
aside{position:sticky;top:16px;padding-top:16px}
.kuu-t{font-family:var(--mono);font-size:11px;color:var(--hall);text-transform:uppercase;margin-bottom:8px}
.kuu{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:13px;border:0;border-left:3px solid transparent;background:transparent;color:var(--tint);padding:5px 8px;cursor:pointer}
.kuu:hover{border-left-color:var(--joon)}
.kuu.on{border-left-color:var(--telliskivi);font-weight:700}
.kuu small{color:var(--hall);float:right}
.content{padding-top:16px}
.frow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px;align-items:center}
.flabel{font-family:var(--mono);font-size:11px;color:var(--hall);min-width:56px;text-transform:uppercase}
.chip{font-family:var(--mono);font-size:12.5px;border:1.5px solid var(--tint);background:transparent;color:var(--tint);padding:4px 11px;cursor:pointer;border-radius:0}
.chip:hover,.chip.on{background:var(--tint);color:var(--paber)}
.count{font-family:var(--mono);font-size:12px;color:var(--hall);padding:12px 0 2px;border-top:1px solid var(--joon);margin-top:10px}
.row{border-bottom:1px solid var(--joon);padding:10px 2px;display:grid;grid-template-columns:72px 1fr 280px;gap:4px;align-items:start}
.row:first-of-type{border-top:2.5px solid var(--tint)}
.thumb{display:block;position:relative;width:100%;line-height:0;text-decoration:none}
.thumb img{width:100%;height:auto;max-height:160px;object-fit:cover;display:block;border:1px solid var(--joon);background:var(--joon)}
.thumb .mark{display:block;width:100%;height:auto;border:1px solid var(--joon);color:var(--paber)}
.thumb.t-festival .mark{color:var(--tint)}
.badge{position:absolute;left:0;bottom:0;background:var(--tint);color:var(--paber);font-family:var(--mono);
  font-size:10px;font-weight:700;padding:1px 4px;letter-spacing:.3px;line-height:1.6;white-space:nowrap;max-width:100%}
.tag{font-family:var(--mono);font-size:10px;color:var(--paber);padding:2px 6px;display:inline-block;text-transform:uppercase;letter-spacing:.4px}
.t-kontsert{background:var(--telliskivi)} .t-festival{background:var(--sinep);color:var(--tint)}
.t-klubi{background:var(--ploom)} .t-reliis{background:var(--paatina)} .t-merch{background:var(--paatina)} .t-muu{background:var(--paatina)}
.tit{font-size:18px;font-weight:700}
.tit a{text-decoration:none;border-bottom:1.5px solid transparent}
.tit a:hover{border-bottom-color:var(--telliskivi)}
.sub{font-size:13.5px;color:var(--hall);margin-top:2px}
.gtags{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.gt{font-family:var(--mono);font-size:11px;border:1px solid var(--joon);color:var(--hall);padding:1px 7px;cursor:pointer;background:transparent;border-radius:0}
.gt:hover,.gt.on{border-color:var(--tint);color:var(--tint)}
.gt.on{border-width:2px;font-weight:700}
.lineup{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 18px}
.bd{display:inline-flex;align-items:center;gap:7px;font-size:14px}
.bd .ic{display:inline-flex;gap:6px;align-items:center}
.tit .bd{margin-left:9px;vertical-align:middle}
.bd a{display:inline-flex;opacity:.85}
.bd a:hover{opacity:1}
.bd svg{width:17px;height:17px;display:block}
.loc{text-align:right;font-size:13.5px;color:var(--hall)}
.loc .venue{color:var(--tint);font-weight:700;display:block;font-size:14.5px}
.lnks{font-family:var(--mono);font-size:11px;margin-top:6px;line-height:1.9}
.lnks a{text-decoration:none;display:inline-block}
.lnks .a1{color:var(--hall)} .lnks .a1:hover{color:var(--tint)}
.lnks .a2{color:var(--telliskivi)}
.lnks .a3{color:var(--paatina);font-weight:700;border:1.5px solid var(--paatina);padding:1px 7px}
.lnks .a3:hover{background:var(--paatina);color:var(--paber)}
.lnks .price{color:var(--hall);display:block;margin-top:2px}
.lnks .price b{color:var(--tint)}
.lnks a:hover{text-decoration:underline}
.lnks .a3:hover{text-decoration:none}
.igbtn{display:block;text-align:center;font-family:var(--mono);font-size:12px;border:1.5px solid var(--tint);background:transparent;color:var(--tint);padding:8px 10px;text-decoration:none;text-transform:uppercase;letter-spacing:.5px}
.igbtn:hover{background:var(--tint);color:var(--paber)}
.footer{border-top:3px solid var(--tint);margin-top:34px;padding:18px 2px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
.ethos{font-size:12.5px;color:var(--hall);max-width:440px}
.empty{font-family:var(--mono);font-size:13px;color:var(--hall);padding:30px 2px}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;padding-top:12px}
  .kuud{display:flex;flex-wrap:wrap;gap:4px}
  .kuu{width:auto;border:1px solid var(--joon);border-left:3px solid transparent}
  .kuu small{float:none;margin-left:7px}
  .row{grid-template-columns:64px 1fr}
  .loc{grid-column:1/3;text-align:left}
  .tagline{text-align:left}
  .mast-right{align-items:flex-start}
  .author{text-align:left}
  .gwords{gap:14px}
}
/* grid-blowout fix: pikk murdmatu sõna (nt üritusenimi) ei tohi veergu laiemaks venitada */
.wrap>*{min-width:0}
.row>*{min-width:0}
.tit{overflow-wrap:anywhere}
.lnks{overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <div class="masthead">

  <nav class="topnav">

<script>
const I18N={
 et:{
{{S010}}
  author_back:"← tagasi live-kalendrisse", nav_updates:"UUENDUSED", nav_sources:"ALLIKAD",

  totop:"Üles",
  t_all:"kõik", t_kontsert:"kontsert", t_festival:"festival", t_klubi:"klubi", t_reliis:"reliis", t_merch:"merch", t_muu:"muu",
{{S012}}
  entries:"kirjet", genre_c:"žanr:", all_months:"kõik kuud", all_genres:"kõik žanrid",
  tag_kontsert:"kontsert", tag_festival:"festival", tag_klubi:"klubi", tag_reliis:"reliis", tag_merch:"merch", tag_muu:"muu",
  organizer:"korraldaja:", listen:"kuula:", source:"allikas:", tickets:"PILETID ↗", price:"Hind:", price_until:"kuni", price_after:"pärast",

 },
 en:{
{{S014}}
  author_back:"← back to live calendar", nav_updates:"UPDATES", nav_sources:"SOURCES",
  umbrella_alt:"estonian alternative", umbrella_net:"one network",
  a_year:"Year", a_month:"Month", a_other:"Other", live_cal:"← Live calendar",
{{S015}}
  ethos_arch:"The archive keeps everything that's ever been on the site — nothing disappears. Every listing still links to its source.",
  totop:"Top",
  t_all:"all", t_kontsert:"concert", t_festival:"festival", t_klubi:"club", t_reliis:"release", t_merch:"merch", t_muu:"other",
{{S016}}
  entries:"entries", genre_c:"genre:", all_months:"all months", all_genres:"all genres",
  tag_kontsert:"concert", tag_festival:"festival", tag_klubi:"club", tag_reliis:"release", tag_merch:"merch", tag_muu:"other",
  organizer:"organiser:", listen:"listen:", source:"source:", tickets:"TICKETS ↗", price:"Price:", price_until:"until", price_after:"then",
  on_spotify:"on Spotify", on_ytm:"on YT Music", on_yt:"on YouTube", on_bc:"on Bandcamp",
  empty_view:"No entries in this view.",
{{S017}}
  err_arch:"Couldn't load the archive.",
  months:["January","February","March","April","May","June","July","August","September","October","November","December"]
 }
};
let LANG=(function(){try{return localStorage.getItem('skene_lang')||'et';}catch(e){return 'et';}})();
function t(k){var d=I18N[LANG]||I18N.et;if(d[k]!==undefined)return d[k];if(I18N.et[k]!==undefined)return I18N.et[k];return k;}
function monthName(mm){return (I18N[LANG]||I18N.et).months[parseInt(mm,10)-1];}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){el.innerHTML=t(el.getAttribute('data-i18n-html'));});
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){var v=t(el.getAttribute('data-i18n-title'));el.setAttribute('title',v);el.setAttribute('aria-label',v);});
  document.title=t('title');
  document.documentElement.setAttribute('lang',LANG);
  document.querySelectorAll('.langsw button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
}
function setLang(l){LANG=l;try{localStorage.setItem('skene_lang',l);}catch(e){}applyI18n();refresh();}
const TYPES=[["t_all",null],["t_kontsert","kontsert"],["t_festival","festival"],["t_klubi","klubi"],["t_reliis","reliis"],["t_merch","merch"],["t_muu","muu"]];
{{S018}}
let YEARS=[], CACHE={}, E=[];
{{S019}}
function enc(x){return encodeURIComponent(x);}
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const surl=u=>/^https?:\/\//i.test(String(u??""))?esc(u):"";
const IC={
 sp:'<svg viewBox="0 0 24 24" aria-label="Spotify"><circle cx="12" cy="12" r="11" fill="#1DB954"/><path d="M6.5 9.6c3.6-1.1 7.6-.7 10.6 1" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M7 12.6c3-.9 6.3-.5 8.8.9" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M7.5 15.4c2.4-.7 5-.4 7 .7" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>',
 ym:'<svg viewBox="0 0 24 24" aria-label="YouTube Music"><circle cx="12" cy="12" r="11" fill="#FF0000"/><circle cx="12" cy="12" r="6.5" stroke="#fff" stroke-width="1.4" fill="none"/><path d="M10.3 9.5l5 2.5-5 2.5z" fill="#fff"/></svg>',
 yt:'<svg viewBox="0 0 24 24" aria-label="YouTube"><rect x="1.5" y="5" width="21" height="14" rx="3.5" fill="#FF0000"/><path d="M10 9l5.5 3L10 15z" fill="#fff"/></svg>',
 bc:'<svg viewBox="0 0 24 24" aria-label="Bandcamp"><circle cx="12" cy="12" r="11" fill="#629AA9"/><path d="M6.4 15.4l4.4-6.8h6.8l-4.4 6.8z" fill="#fff"/></svg>'
};
let BANDS={};
function bandIco(u,ic,tk,b){return `<a href="${surl(u)}" target="_blank" rel="noopener" title="${esc(b)} ${t(tk)}">${ic}</a> `;}
function bandIcons(b){
 const v=BANDS[b];let ics="";
 if(v){
  if(v.sp)ics+=bandIco(v.sp,IC.sp,'on_spotify',b);
  if(v.ym)ics+=bandIco(v.ym,IC.ym,'on_ytm',b);
  if(v.yt)ics+=bandIco(typeof v.yt==="string"?v.yt:"https://www.youtube.com/results?search_query="+enc(b),IC.yt,'on_yt',b);
  if(v.bc)ics+=bandIco(v.bc,IC.bc,'on_bc',b);
 }else{
  ics=bandIco("https://open.spotify.com/search/"+enc(b),IC.sp,'on_spotify',b)
   +bandIco("https://music.youtube.com/search?q="+enc(b),IC.ym,'on_ytm',b)
   +bandIco("https://www.youtube.com/results?search_query="+enc(b),IC.yt,'on_yt',b);
 }
 return ics;
}
function band(b){
 const ics=bandIcons(b);
 return `<span class="bd"><span>${esc(b)}</span>${ics?`<span class="ic">${ics}</span>`:""}</span>`;
}
// --- pisipilt: paris pilt (e.img) voi tuubimark; sama komplekt mis index.html-is ---
const MARK_S='stroke="currentColor" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
const MARGID={
  reliis:'<circle cx="50" cy="50" r="30" '+MARK_S+'/><circle cx="50" cy="50" r="19" stroke="currentColor" fill="none" stroke-width="2" opacity=".7"/><circle cx="50" cy="50" r="9" fill="currentColor"/>',
  merch:'<path d="M37 26 L26 32 L20 46 L31 51 L34 44 L34 78 L66 78 L66 44 L69 51 L80 46 L74 32 L63 26 C60 33 40 33 37 26 Z" '+MARK_S+'/>',
  klubi:'<rect x="30" y="18" width="40" height="64" rx="3" '+MARK_S+'/><circle cx="50" cy="37" r="7" '+MARK_S+'/><circle cx="50" cy="62" r="12" '+MARK_S+'/>',
  festival:'<path d="M18 76 L50 34 L82 76" '+MARK_S+'/><path d="M18 76 H82" '+MARK_S+'/><path d="M50 34 V20" '+MARK_S+'/><path d="M50 20 L66 25 L50 30" '+MARK_S+'/>',
  muu:'<path d="M50 24 V76 M28 37 L72 63 M72 37 L28 63" '+MARK_S+'/>',
  kontsert:'<rect x="42" y="18" width="16" height="32" rx="8" '+MARK_S+'/><path d="M32 46 a18 18 0 0 0 36 0" '+MARK_S+'/><path d="M50 64 V78" '+MARK_S+'/><path d="M38 78 H62" '+MARK_S+'/>'
};
// pisipildi tee on ALATI kohalik ja suhteline (pildid/<slug>.webp) - vali-URL-e ei lubata
const purl=u=>/^pildid\/[A-Za-z0-9._-]+\.(webp|jpg|jpeg|png)$/i.test(String(u??""))?esc(u):"";
function thumbHtml(e,tc){
  const link=surl(e.ou||e.su);
  const pu=purl(e.img);
  const pilt=pu?`<img src="${pu}" alt="" loading="lazy" decoding="async">`
    :'<svg class="mark" viewBox="0 0 100 100" role="img" aria-label="'+esc(t('tag_'+e.t))+'">'+(MARGID[e.t]||MARGID.kontsert)+'</svg>';
  const kl="thumb"+(pu?"":" "+tc);
  // arhiivis on aasta ALATI juures - vaade katab mitut aastat
  const sisu=`${pilt}<span class="badge">${fmt(e)}${e.d?(e.d2?" ":".")+esc(e.d.slice(2,4)):""}</span>`;
  return link?`<a class="${kl}" href="${link}" target="_blank" rel="noopener">${sisu}</a>`
             :`<span class="${kl}">${sisu}</span>`;
}
function priceLine(e){
  if(!e.hind)return "";
  const h=e.hind;
  if(h.kuni&&h.jargmine)return `<span class="price">${t('price')} <b>${esc(h.praegu)}</b> ${t('price_until')} ${esc(h.kuni)}, ${t('price_after')} <b>${esc(h.jargmine)}</b></span>`;
  return `<span class="price">${t('price')} <b>${esc(h.praegu)}</b>${h.mark?" — "+esc(h.mark):""}</span>`;
}
function fmt(e){
  if(e.tba)return"TBA";
  const dt=new Date(e.d+"T00:00");

}
