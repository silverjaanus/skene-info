<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uudiskirja eelistused — skene.info</title>
<meta name="description" content="Halda skene.info uudiskirja teemasid: metal, räpp, klubi.">
<meta name="robots" content="noindex,nofollow">
<script defer src="/_vercel/insights/script.js"></script>
<style>
:root{
  --paber:#F3F0E7; --tint:#1A1A1A; --hall:#5A564C; --joon:#8F8A7C;
  --telliskivi:#93392C; --paatina:#2C5B54;
  --metal:#93392C; --rap:#2E5EAA; --klubi:#6E45A8;
  --sans:"Helvetica Neue",Helvetica,Arial,ui-sans-serif,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paber);color:var(--tint);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:inherit}
header{padding:26px 24px 0;max-width:820px;margin:0 auto}
.masthead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;border-bottom:3px solid var(--tint);padding-bottom:14px}
.brand{font-size:clamp(26px,5vw,38px);line-height:.92;letter-spacing:-1.5px;text-transform:uppercase;font-weight:700;text-decoration:none}
.brand .info{color:var(--telliskivi)}
.topnav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 18px;padding:10px 0 12px;font-family:var(--mono);font-size:12.5px}
.topnav a{text-decoration:none;color:var(--tint)}
.topnav a:hover{color:var(--telliskivi)}
.langsw{display:flex;border:1.5px solid var(--joon);flex:none}
.langsw button{font-family:var(--mono);font-size:11.5px;background:transparent;color:var(--hall);border:0;padding:3px 9px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.langsw button.on{background:var(--tint);color:var(--paber)}
main{max-width:820px;margin:0 auto;padding:22px 24px 60px}
h1{font-size:clamp(30px,5vw,44px);line-height:1;letter-spacing:-1px;text-transform:uppercase;font-weight:700;margin-bottom:6px}
p{margin:0 0 12px;max-width:66ch}
.lead{font-size:17px;margin-bottom:22px}
.who{font-family:var(--mono);font-size:12.5px;color:var(--hall);margin-bottom:22px}
.opts{list-style:none;margin:0 0 24px;padding:0;max-width:66ch}
.opt{border:1.5px solid var(--joon);background:#FBFAF5;margin:0 0 10px}
.opt label{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--tint);flex:none;cursor:pointer}
.opt .nm{font-family:var(--mono);font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.opt .ds{font-size:14.5px;color:var(--hall);margin-top:3px}
.opt[data-cat="metal"]{border-left:5px solid var(--metal)}
.opt[data-cat="rap"]{border-left:5px solid var(--rap)}
.opt[data-cat="klubi"]{border-left:5px solid var(--klubi)}
.btn{font-family:var(--mono);font-size:13px;letter-spacing:.4px;text-transform:uppercase;background:var(--tint);color:var(--paber);border:0;padding:13px 20px;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:default}
.msg{font-family:var(--mono);font-size:13px;padding:12px 14px;border:1.5px solid var(--joon);margin:0 0 20px;max-width:66ch}
.msg.ok{border-color:var(--paatina);color:var(--paatina)}
.msg.err{border-color:var(--telliskivi);color:var(--telliskivi)}
.hint{font-size:14px;color:var(--hall);max-width:66ch;margin-top:18px}
.hide{display:none}
.foot{border-top:3px solid var(--tint);margin-top:40px;padding:16px 0 0;font-family:var(--mono);font-size:12px;color:var(--hall)}
.foot a{color:var(--tint)}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <a class="brand" href="/">Skene<span class="info">.info</span></a>
  </div>
  <nav class="topnav">
    <a href="/" data-i18n="nav_home">← TAGASI</a>
    <div class="langsw" role="group" aria-label="Keel / Language">
      <button type="button" data-lang="et" onclick="setLang('et')">EE</button>
      <button type="button" data-lang="en" onclick="setLang('en')">EN</button>
    </div>
  </nav>
</header>
<main>
  <h1 data-i18n="title">Uudiskirja eelistused</h1>
  <p class="lead" data-i18n="lead">Vali, millised teemad su nädalakirjas on. Kõik valitud teemad tulevad ühes kirjas.</p>

  <div id="msg" class="msg hide"></div>
  <p id="who" class="who hide"></p>

  <form id="form" class="hide" onsubmit="return save(event)">
    <ul class="opts">
      <li class="opt" data-cat="metal"><label>
        <input type="checkbox" value="metal">
        <span><span class="nm" data-i18n="c_metal">Metal</span>
        <span class="ds" data-i18n="d_metal"></span></span>
      </label></li>
      <li class="opt" data-cat="rap"><label>
        <input type="checkbox" value="rap">
        <span><span class="nm" data-i18n="c_rap">Räpp</span>
        <span class="ds" data-i18n="d_rap"></span></span>
      </label></li>
      <li class="opt" data-cat="klubi"><label>
        <input type="checkbox" value="klubi">
        <span><span class="nm" data-i18n="c_klubi">Klubi</span>
        <span class="ds" data-i18n="d_klubi"></span></span>
      </label></li>
    </ul>
    <button id="btn" class="btn" type="submit" data-i18n="save">Salvesta</button>
    <p class="hint" data-i18n-html="hint"></p>
  </form>

  <div class="foot">
    <b>skene.info</b> — <span data-i18n="foot">üritused, reliisid ja merch ühest kohast.</span>
    &nbsp;·&nbsp; <a href="/privaatsus.html" data-i18n="foot_priv">Privaatsus</a>
  </div>
</main>
<script>
var I18N={
 et:{
  page_title:"Uudiskirja eelistused — skene.info",
  nav_home:"← TAGASI",
  title:"Uudiskirja eelistused",
  lead:"Vali, millised teemad su nädalakirjas on. Kõik valitud teemad tulevad ühes kirjas.",
  c_metal:"Metal", d_metal:"Metal, hardcore, punk, dark electro — skene.info põhivoog.",
  c_rap:"Räpp", d_rap:"Eesti räpp ja hiphop — rap.skene.info.",
  c_klubi:"Klubi", d_klubi:"Klubiõhtud, DJ-d, elektrooniline muusika — klubi.skene.info.",
  save:"Salvesta", saving:"Salvestan…",
  hint:"Kui võtad kõik linnukesed maha, ei saada me sulle enam ühtegi nädalakirja, aga su aadress jääb listi. Täielikuks loobumiseks kasuta kirja jaluses olevat <b>loobu</b> linki.",
  loading:"Laen su eelistusi…",
  saved:"Salvestatud. Järgmine nädalakiri tuleb uute valikutega.",
  savednone:"Salvestatud. Ühtegi teemat pole valitud — nädalakirja me sulle ei saada.",
  who:"Aadress: ",
  e_link:"See leht avaneb ainult uudiskirjas oleva lingi kaudu. Ava oma viimane skene.info kiri ja klõpsa seal „Halda eelistusi“.",
  e_auth:"Link ei kehti. Kopeeri see uuesti uudiskirjast — võib-olla jäi lõpp puudu.",
  e_notfound:"Seda aadressi pole meie listis.",
  e_ml:"Midagi läks katki — proovi hiljem uuesti.",
  e_unsub:"See aadress on uudiskirjast loobunud. Uuesti liitumiseks kasuta saidil olevat tellimisvormi.",
  foot:"üritused, reliisid ja merch ühest kohast.", foot_priv:"Privaatsus"
 },
 en:{
  page_title:"Newsletter preferences — skene.info",
  nav_home:"← BACK",
  title:"Newsletter preferences",
  lead:"Choose which topics your weekly email covers. Everything you pick arrives in one email.",
  c_metal:"Metal", d_metal:"Metal, hardcore, punk, dark electro — the main skene.info feed.",
  c_rap:"Rap", d_rap:"Estonian rap and hip-hop — rap.skene.info.",
  c_klubi:"Club", d_klubi:"Club nights, DJs, electronic music — klubi.skene.info.",
  save:"Save", saving:"Saving…",
  hint:"If you untick everything, we stop sending the weekly email but your address stays on the list. To leave for good, use the <b>unsubscribe</b> link in the email footer.",
  loading:"Loading your preferences…",
  saved:"Saved. Your next weekly email will follow the new selection.",
  savednone:"Saved. No topics selected — we won't send you the weekly email.",
  who:"Address: ",
  e_link:"This page only opens through the link in the newsletter. Open your latest skene.info email and click “Manage preferences”.",
  e_auth:"This link is not valid. Copy it again from the newsletter — the end may have been cut off.",
  e_notfound:"This address is not on our list.",
  e_ml:"Something broke — please try again later.",
  e_unsub:"This address has unsubscribed. To rejoin, use the signup form on the site.",
  foot:"events, releases and merch in one place.", foot_priv:"Privacy"
 }
};
var Q=new URLSearchParams(location.search);
var EMAIL=(Q.get("e")||"").trim(), TOK=(Q.get("t")||"").trim();
var LANG=(function(){try{return Q.get("l")||localStorage.getItem('skene_lang')||'et';}catch(e){return Q.get("l")||'et';}})();
if(LANG!=='en'&&LANG!=='et')LANG='et';
var LANG_LOCKED=false;
function t(k){var d=I18N[LANG]||I18N.et;return d[k]!==undefined?d[k]:(I18N.et[k]!==undefined?I18N.et[k]:k);}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){el.innerHTML=t(el.getAttribute('data-i18n-html'));});
  document.title=t('page_title');
  document.documentElement.setAttribute('lang',LANG);
  document.querySelectorAll('.langsw button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  var w=document.getElementById('who');
  if(!w.classList.contains('hide'))w.textContent=t('who')+EMAIL;
}
function setLang(l){LANG=l;LANG_LOCKED=true;try{localStorage.setItem('skene_lang',l);}catch(e){}applyI18n();}
function msg(kind,key){
  var m=document.getElementById('msg');
  m.className='msg '+(kind||'');
  m.setAttribute('data-i18n',key);
  m.textContent=t(key);
}
function boxes(){return Array.prototype.slice.call(document.querySelectorAll('.opt input'));}
function fail(key){
  document.getElementById('form').classList.add('hide');
  msg('err',key);
}
function api(method,payload){
  var url='/api/eelistused';
  var opt={method:method,headers:{'Accept':'application/json'}};
  if(method==='GET'){url+='?e='+encodeURIComponent(EMAIL)+'&t='+encodeURIComponent(TOK);}
  else{opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(payload);}
  return fetch(url,opt).then(function(r){return r.json().catch(function(){return {ok:false,error:'ml'};}).then(function(j){j._http=r.status;return j;});});
}
function errKey(j){
  if(!j)return 'e_ml';
  if(j.error==='auth')return 'e_auth';
  if(j.error==='notfound')return 'e_notfound';
  return 'e_ml';
}
function render(j){
  if(!LANG_LOCKED&&j.lang&&j.lang!==LANG){LANG=j.lang;}
  document.getElementById('who').classList.remove('hide');
  boxes().forEach(function(b){b.checked=(j.groups||[]).indexOf(b.value)>=0;});
  document.getElementById('form').classList.remove('hide');
  applyI18n();
  if(j.status&&j.status!=='active'){msg('err','e_unsub');}
}
function save(ev){
  ev.preventDefault();
  var btn=document.getElementById('btn');
  var sel=boxes().filter(function(b){return b.checked;}).map(function(b){return b.value;});
  btn.disabled=true;btn.textContent=t('saving');
  api('POST',{e:EMAIL,t:TOK,groups:sel}).then(function(j){
    btn.disabled=false;btn.textContent=t('save');
    if(!j.ok){msg('err',errKey(j));return;}
    msg('ok',(j.groups&&j.groups.length)?'saved':'savednone');
    boxes().forEach(function(b){b.checked=(j.groups||[]).indexOf(b.value)>=0;});
  }).catch(function(){btn.disabled=false;btn.textContent=t('save');msg('err','e_ml');});
  return false;
}
applyI18n();
if(!EMAIL||!TOK){fail('e_link');}
else{
  msg('','loading');
  api('GET').then(function(j){
    if(!j.ok){fail(errKey(j));return;}
    document.getElementById('msg').classList.add('hide');
    render(j);
  }).catch(function(){fail('e_ml');});
}
</script>
</body>
</html>
