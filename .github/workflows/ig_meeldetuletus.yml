name: IG laupaeva meeldetuletus

# Laupäeva story teeb Silver ise; see saadab talle Telegrami (@SilveriPC_bot) tänase story-pildi.
# Võti: repo secret TELEGRAM_BOT_TOKEN.
on:
  schedule:
    - cron: "45 6 * * 6"   # L 06:45 UTC (09:45 suveajal, 08:45 talveajal)
  workflow_dispatch: {}

jobs:
  meelde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Saada Telegrami
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "1810496014"
        run: python scripts/ig_meeldetuletus.py
