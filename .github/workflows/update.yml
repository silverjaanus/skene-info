name: Andmekorje

on:
  schedule:
    - cron: "30 4 * * *"   # iga paev 04:30 UTC (07:30 Eesti suveajal)
  workflow_dispatch: {}

# valdi topeltjooks: cron + kasitsi dispatch ei tohi korraga joosta
concurrency:
  group: andmekorje
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 14.08.2026: v4/v5 sihtisid Node 20 (aegunud). v7 = node24.
      # ⚠ Alumine "Commit kui muutus" samm teeb paljast `git push`-i ja soltub
      # sellest, et checkout jatab tokeni git-konfi (persist-credentials).
      # Kontrollitud v7 action.yml-ist: vaikevaartus on endiselt true.
      - uses: actions/checkout@v7
        with:
          # EKSPLITSIITNE, mitte vaikevaartuse lootuses: alumine "Commit kui
          # muutus" samm teeb paljast `git push`-i ja vajab, et token oleks
          # git-konfis. Nii ei saa actioni vaikevaartuse muutus seda vaikselt
          # katki teha (14.08.2026).
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # eraldi sammud: uhe saidi korje kukkumine ei jata teisi tegemata.
      # Kukkumine EI jaa enam margatamatuks: all on "Korje staatus" samm,
      # mis failib jobi, kui moni korje ebaonnestus (13.08.2026 audit).
      - name: Korje metal
        id: metal
        continue-on-error: true
        run: python scripts/fetch.py
      - name: Korje rap
        id: rap
        continue-on-error: true
        run: python scripts/fetch_rap.py
      - name: Korje klubi
        id: klubi
        continue-on-error: true
        run: python scripts/fetch_klubi.py
      # allikad.json + feed/api eraldi sammuna: varem joosti need ainult
      # fetch.py seest, st metal-poole viga kylmutas ka rap+klubi allikalehed
      - name: Allikad + API
        id: buildjson
        continue-on-error: true
        run: |
          python scripts/build_sources.py
          python scripts/build_api.py
      # moodunud kirjete puhastus manual.json-idest (Silveri otsus 13.08.2026):
      # eemaldab AINULT arhiivis kinnitatud, 14+ paeva vanad, mitte-live kirjed
      - name: Manuali puhastus
        continue-on-error: true
        run: python scripts/prune_manual.py
      # duplikaadi-/kummitusekontroll ENNE commit'i: kahtluse korral
      # commit'i EI tehta ja job laheb punaseks (inimene vaatab ule)
      - name: Duplikaadikontroll
        run: python scripts/check_dupes.py
      - name: Commit kui muutus
        run: |
          git config user.name "skene-bot"
          git config user.email "actions@users.noreply.github.com"
          # ⚠ 17.08.2026: rap/api/archive.json + klubi/api/archive.json olid
          # siit puudu (tekkisid 16.08 commit'is 1592ca3, B5e). Need jaid
          # commitimata -> `git pull --rebase` suri "cannot pull with rebase:
          # You have unstaged changes" (exit 128). Uus valjundfail => lisa siia.
          git add data/data.json rap/data/data.json klubi/data/data.json data/manual.json rap/data/manual.json klubi/data/manual.json data/allikad.json rap/data/allikad.json klubi/data/allikad.json feed/events.json feed/archive.json rap/api/events.json rap/api/archive.json klubi/api/events.json klubi/api/archive.json data/archive rap/data/archive klubi/data/archive
          git diff --cached --quiet || (git commit -m "andmekorje $(date -u +%F)" && git pull --rebase origin main && git push)
      # valve: kui korje kirjutas faili, mida ulaltoodud `git add` ei kata,
      # jaab see commitimata ja tapab JARGMISE jooksu rebase'i. Siin laheb
      # job punaseks kohe ja logi utleb, MILLINE fail puudu on.
      - name: Commitimata jaanud failid
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --porcelain --untracked-files=no
            echo "::error::Korje muutis faile, mida 'Commit kui muutus' git add ei kata — lisa need nimekirja"
            exit 1
          fi
      # nahtavus: kui moni ulaltoodud continue-on-error samm kukkus,
      # laheb job SIIN punaseks — Actions-vaade ei valeta enam rohelist
      - name: Korje staatus
        if: always()
        run: |
          echo "metal=${{ steps.metal.outcome }} rap=${{ steps.rap.outcome }} klubi=${{ steps.klubi.outcome }} allikad/api=${{ steps.buildjson.outcome }}"
          if [ "${{ steps.metal.outcome }}" != "success" ] || \
             [ "${{ steps.rap.outcome }}" != "success" ] || \
             [ "${{ steps.klubi.outcome }}" != "success" ] || \
             [ "${{ steps.buildjson.outcome }}" != "success" ]; then
            echo "::error::Vahemalt uks korje-/buildisamm kukkus — vaata sammude logisid"
            exit 1
          fi
