name: Kontrollid

# 13.08.2026 audit: kerge CI iga pushi peale — syntaks, genereeritud HTML-i
# kasitsi-muutmise valve, duplikaadi-/meta-sync-kontroll, tagasiside API test.
# NB andmekorje (update.yml) pushid GITHUB_TOKEN-iga SEDA workflow'd ei kaivita
# (GitHubi rekursioonikaitse) — see valvab inim-pushe.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  kontrollid:
    runs-on: ubuntu-latest
    steps:
      # 14.08.2026: v4/v5 sihtisid Node 20 (aegunud, GitHub sundis Node 24 peale).
      # v7 deklareerib ise node24. persist-credentials vaikimisi endiselt true.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Syntaks (py_compile)
        run: python -m py_compile scripts/*.py
      - name: Genereeritud HTML puutumata (build_pages --check)
        run: python scripts/build_pages.py --check
      - name: Duplikaadid + GENRE_META sync
        run: python scripts/check_dupes.py
      # 21.08.2026 audit: blokitud kirje manual.json-is katkestagu korje kovasti
      # (varem vaikne filter -> Alma Negra tuli 14.08 sweepiga tagasi).
      - name: Blocklisti-valve (fail_if_manual_blocked)
        run: python scripts/test_blocklist_guard.py
      # 14.08.2026: kirja jarjestusparandused olid eelvaate tees, saatmistee
      # kasutas oma koopiat -> valjalainud kiri oli vale. See samm valvab, et
      # jarjestus tuleks ainult common.order_for_output()-ist.
      - name: Kirja jarjestus (saatmistee == eelvaade)
        run: python scripts/check_send_parity.py --repo .
      - name: Tagasiside API test (mokitud)
        run: node scripts/test_tagasiside.js
      # 15.08.2026: mitmepaevased kirjed kadusid teisel paeval ara (past-reegel luges
      # ainult alguskuupaeva). Test loeb funktsioonid genereeritud index.html-ist.
      - name: Kuupaevaloogika (mitmepaevased kirjed)
        run: node scripts/test_kuupaevad.js
      # 15.08.2026: base.html-i uus `const _ft` sattus rapi S077-s oleva `var _ft`-ga samasse
      # skoopi -> SyntaxError tappis rap.skene.info-l kogu lehe skripti, www ja klubi tootasid.
      # Slotisusteemis on see korduv oht: tukid on eraldi korras, kokku pandult mitte.
      - name: Genereeritud lehtede JS-suntaks
        run: node scripts/test_syntaks.js
      # 16.08.2026: kalendritellimuse endpoint. ICS-i vead ei ole ekraanil naha -- nad
      # ilmnevad alles kellegi telefoni kalendris (75-oktetine reapiir, CRLF, DTEND valispiir).
      - name: Kalendritellimuse ICS
        run: node scripts/test_kalender.js
