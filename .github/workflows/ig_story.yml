name: IG story

# 09.10.2026 kasvuplaan etapp 2: Make.com-il pole Instagrami story-moodulit,
# seega postitame otse Instagrami API-ga. Pilt + ig/today.json tulevad Andmekorjest
# (07:30). Lüliti: data/ig_seaded.json "story". Võti: repo secret ZERNIO_API_KEY.
on:
  schedule:
    - cron: "0 7 * * 4,6"   # N/L (Zernio tasuta = 10 postitust kuus; T teeb Silver ise) 07:00 UTC (10:00 suveajal, 09:00 talveajal)
  workflow_dispatch: {}

concurrency:
  group: ig-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Postita story
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ secrets.ZERNIO_ACCOUNT_ID }}
        run: python scripts/ig_publish.py
      - name: Logi commit
        run: |
          git config user.name "skene-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f ig/postitatud.json ]; then git add ig/postitatud.json; fi
          git diff --cached --quiet || (git commit -m "ig story $(date -u +%F)" && git pull --rebase origin main && git push)
