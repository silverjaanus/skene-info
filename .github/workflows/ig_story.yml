name: IG story

# 09.10.2026 kasvuplaan etapp 2: postitame story otse Instagrami API-ga (oma Meta app).
# Pilt + ig/today.json tulevad Andmekorjest (07:30). Lüliti: data/ig_seaded.json "story".
# Secretid: IG_TOKEN (Instagram), GH_PAT (et uuendatud IG_TOKEN tagasi salvestada).
on:
  schedule:
    - cron: "0 7 * * 2,4,6"   # T/N/L 07:00 UTC (10:00 suveajal, 09:00 talveajal)
  workflow_dispatch:
    inputs:
      kontroll:
        description: "Ainult kontrolli tokenit (ei postita)"
        type: boolean
        default: true

concurrency:
  group: ig-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Postita story
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_NEW_TOKEN_FILE: ${{ runner.temp }}/ig_token
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "1810496014"
        run: python scripts/ig_publish.py ${{ inputs.kontroll && '--check' || '' }}
      - name: Salvesta uuendatud token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="${{ runner.temp }}/ig_token"
          if [ -s "$f" ]; then
            if [ -n "$GH_TOKEN" ]; then gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" && echo "IG_TOKEN uuendatud";
            else echo "::warning::GH_PAT puudub -- uus IG_TOKEN jai salvestamata"; fi
            rm -f "$f"
          fi
      - name: Teata veast Telegrami
        # 05.11.2026 (Silver): story kukkumisest kohe teada, mitte alles 18.05 valvuri kaudu
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "1810496014"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "TELEGRAM_BOT_TOKEN puudub"; exit 0; }
          msg="⚠️ skene.info IG story kukkus ($(TZ=Europe/Tallinn date '+%d.%m %H:%M')). Kui logis on OAuthException 190, on IG token kehtetu: tee uus token ja pane GitHubi IG_TOKEN-isse. Logi: $RUN_URL"
          curl -sS -o /dev/null -w "Telegram HTTP %{http_code}\n" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$msg" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || echo "Telegram ei onnestunud"
      - name: Logi commit
        # always(): mitme slaidi story pooleli jaamisel peab logi ikkagi salvestuma (05.11.2026)
        if: ${{ always() }}
        run: |
          git config user.name "skene-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f ig/postitatud.json ]; then git add ig/postitatud.json; fi
          git diff --cached --quiet || (git commit -m "ig story $(date -u +%F)" && git pull --rebase origin main && git push)
